<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institutional Trading Calendar (2026-2029)</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            padding: 40px; 
            max-width: 1600px; 
            margin: 0 auto; 
        }
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid #334155; 
            padding-bottom: 20px; 
            margin-bottom: 30px; 
        }
        h1 { color: #38bdf8; margin: 0; font-size: 32px; }
        .nav-btn { background: #38bdf8; color: #0f172a; border: none; padding: 12px 24px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-left: 10px; font-size: 16px; transition: 0.2s; }
        .nav-btn:hover { background: #0ea5e9; transform: translateY(-2px); }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 25px; 
        }
        .weekday { text-align: center; font-weight: bold; color: #94a3b8; padding: 15px; text-transform: uppercase; font-size: 16px; letter-spacing: 2px; }
        .day-card { 
            background: #1e293b; 
            border-radius: 16px; 
            padding: 25px; 
            min-height: 220px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            border-left: 10px solid #64748b; 
            cursor: pointer; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease-in-out; 
        }
        .day-card:hover { transform: scale(1.04); background: #2d3e5a; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
        .trade { border-left-color: #22c55e; background: linear-gradient(145deg, #1e293b, #14231a); }
        .caution { border-left-color: #eab308; background: linear-gradient(145deg, #1e293b, #242214); }
        .avoid { border-left-color: #ef4444; background: linear-gradient(145deg, #1e293b, #2a1a1a); }
        .empty { background: transparent; pointer-events: none; border: none; }
        .date-num { font-weight: bold; font-size: 24px; color: #f1f5f9; }
        .status-txt { font-size: 12px; font-weight: 900; text-transform: uppercase; margin-top: 12px; padding: 6px 12px; border-radius: 6px; display: inline-block; width: fit-content; }
        .status-trade { color: #4ade80; background: rgba(34, 197, 94, 0.2); }
        .status-caution { color: #fde047; background: rgba(234, 179, 8, 0.2); }
        .status-avoid { color: #fca5a5; background: rgba(239, 68, 68, 0.2); }
        .drivers { font-size: 14px; color: #cbd5e1; margin-top: 15px; line-height: 1.6; font-weight: 500; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.9); justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(8px); }
        .modal-content { background: #1e293b; border-radius: 20px; padding: 40px; max-width: 600px; width: 90%; border: 1px solid #334155; position: relative; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .close-btn { position: absolute; top: 20px; right: 25px; color: #94a3b8; font-size: 32px; cursor: pointer; }
        .modal-rule { background: #0f172a; padding: 20px; border-radius: 10px; border-left: 6px solid #38bdf8; font-style: italic; margin-top: 25px; color: #e2e8f0; line-height: 1.6; font-size: 16px; }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>Institutional Trading Protocol Dashboard</h1>
            <div style="color: #94a3b8; font-size: 16px; margin-top: 6px;">Logic-Based Risk Matrix (Syncing: 2026 - 2029)</div>
        </div>
        <div>
            <button class="nav-btn" onclick="changeMonth(-1)">« Prev</button>
            <button class="nav-btn" onclick="goToToday()">Today</button>
            <button class="nav-btn" onclick="changeMonth(1)">Next »</button>
        </div>
    </header>

    <h2 id="month-year-title" style="color: #cbd5e1; margin-bottom: 25px; font-size: 28px;"></h2>

    <div class="grid" id="weekday-header">
        <div class="weekday">Sun</div><div class="weekday">Mon</div><div class="weekday">Tue</div>
        <div class="weekday">Wed</div><div class="weekday">Thu</div><div class="weekday">Fri</div>
        <div class="weekday">Sat</div>
    </div>

    <div class="grid" id="calendar-grid"></div>

    <div class="modal" id="rule-modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modal-title" style="font-size: 28px;">Day Overview</h2>
            <p id="modal-date" style="color: #38bdf8; font-weight: bold; margin-bottom: 25px; font-size: 18px;"></p>
            <p style="margin-bottom: 8px; font-size: 18px;"><strong>News Drivers:</strong></p>
            <p id="modal-drivers" style="color: #f1f5f9; margin-top: 0; font-size: 17px;"></p>
            <div class="modal-rule">
                <strong>Execution Protocol:</strong>
                <p id="modal-protocol-text" style="margin-top: 10px;"></p>
            </div>
        </div>
    </div>

    <script>
        let currentCalendarDate = new Date(); 

        function getDayProtocol(date) {
            const dayNum = date.getDay();
            const dayOfMonth = date.getDate();
            const weekIndex = Math.ceil(dayOfMonth / 7);

            if (dayNum === 0 || dayNum === 6) {
                return { status: 'empty', label: 'Weekend', drivers: 'Market Closed', rule: 'Market closed. Review weekly performance and prep for Sunday open.' };
            }

            if (dayNum === 1) {
                return { status: 'avoid', label: 'Avoid / Low Probable', drivers: 'No High-Impact Drivers', rule: 'Monday Protocol: Typically lacks structural order flow. Low probability. Sit on your hands.' };
            }

            if (dayNum === 2 && weekIndex === 2) {
                return { status: 'trade', label: 'Regular AM Session', drivers: 'USD: Core CPI / CPI y/y', rule: 'Tuesday CPI: High volatility at 6:30 AM. Wait for the initial expansion. Trade the regular AM session under normal size.' };
            }

            if (dayNum === 3 && weekIndex === 2) {
                return { status: 'trade', label: 'High Probable Setup', drivers: 'USD: Core PPI / PPI m/m', rule: 'Wednesday PPI: Follows CPI displacement. Seek & Destroy configuration often present. Premium environment.' };
            }

            if (dayNum === 4) {
                let drivers = 'USD: Unemployment Claims';
                if (weekIndex === 2) drivers += ' / Retail Sales';
                return { status: 'trade', label: 'High Probable Setup', drivers: drivers, rule: 'Thursday Protocol: High liquidity. Claims + Retail Sales provide clean expansion. Standard risk permitted.' };
            }

            if (dayNum === 5 && weekIndex === 1) {
                return { status: 'caution', label: 'Caution / NFP', drivers: 'USD: Non-Farm Payrolls', rule: 'NFP Friday: Wait for 9:30 AM manipulation. Only trade if institutional footprints are clear.' };
            }

            if (dayNum === 5) {
                return { status: 'avoid', label: 'Avoid / Close Out', drivers: 'Weekly Close', rule: 'Friday Protocol: Don’t give gains back to the casino. Close out early.' };
            }

            return { status: 'trade', label: 'Standard Trade Day', drivers: 'USD Medium Impact News', rule: 'Standard session parameters apply. Look for 8:30 AM or 10:00 AM setups.' };
        }

        function renderCalendar() {
            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            
            document.getElementById('month-year-title').innerText = monthNames[month] + " " + year;
            
            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const gridContainer = document.getElementById('calendar-grid');
            gridContainer.innerHTML = '';

            for (let i = 0; i < firstDayIndex; i++) {
                let spacer = document.createElement('div');
                spacer.className = 'day-card empty';
                gridContainer.appendChild(spacer);
            }

            for (let day = 1; day <= totalDays; day++) {
                const checkDate = new Date(year, month, day);
                const protocol = getDayProtocol(checkDate);
                const card = document.createElement('div');
                
                if (protocol.status === 'empty') {
                    card.className = 'day-card empty';
                    card.innerHTML = '<div class="date-num" style="color:#475569;">' + day + '</div>';
                } else {
                    card.className = 'day-card ' + protocol.status;
                    card.onclick = function() { showModal(checkDate, protocol); };
                    card.innerHTML = '<div class="date-num">' + day + '</div>' +
                                     '<div class="drivers">' + protocol.drivers + '</div>' +
                                     '<span class="status-txt status-' + protocol.status + '">' + protocol.label + '</span>';
                }
                gridContainer.appendChild(card);
            }
        }

        function changeMonth(dir) { currentCalendarDate.setMonth(currentCalendarDate.getMonth() + dir); renderCalendar(); }
        function goToToday() { currentCalendarDate = new Date(); renderCalendar(); }
        function showModal(date, protocol) {
            document.getElementById('modal-title').innerText = protocol.label;
            document.getElementById('modal-date').innerText = date.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
            document.getElementById('modal-drivers').innerText = protocol.drivers;
            document.getElementById('modal-protocol-text').innerText = protocol.rule;
            document.getElementById('rule-modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('rule-modal').style.display = 'none'; }
        window.onload = renderCalendar;
    </script>
</body>
</html>
