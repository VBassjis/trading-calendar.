<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Institutional Risk Engine</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            padding: 40px; 
            max-width: 1650px; 
            margin: 0 auto; 
        }
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid #334155; 
            padding-bottom: 20px; 
            margin-bottom: 30px; 
        }
        h1 { color: #38bdf8; margin: 0; font-size: 32px; font-weight: 800; }
        .live-badge {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid #22c55e;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .live-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
        
        .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 25px; }
        .weekday { text-align: center; font-weight: bold; color: #94a3b8; padding: 15px; text-transform: uppercase; font-size: 16px; letter-spacing: 2px; }
        
        .day-card { 
            background: #1e293b; 
            border-radius: 16px; 
            padding: 25px; 
            min-height: 240px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            border-left: 10px solid #64748b; 
            cursor: pointer; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease-in-out; 
        }
        .day-card:hover { transform: scale(1.03); background: #2d3e5a; }
        
        /* DYNAMIC LEVEL COLORS */
        .trade { border-left-color: #22c55e; background: linear-gradient(145deg, #1e293b, #132219); }
        .caution { border-left-color: #eab308; background: linear-gradient(145deg, #1e293b, #242112); }
        .avoid { border-left-color: #ef4444; background: linear-gradient(145deg, #1e293b, #281818); }
        .empty { background: transparent; pointer-events: none; border: none; }
        
        .date-num { font-weight: bold; font-size: 26px; color: #f1f5f9; }
        .status-txt { font-size: 11px; font-weight: 900; text-transform: uppercase; margin-top: 12px; padding: 6px 12px; border-radius: 6px; display: inline-block; width: fit-content; }
        .status-trade { color: #4ade80; background: rgba(34, 197, 94, 0.2); }
        .status-caution { color: #fde047; background: rgba(234, 179, 8, 0.2); }
        .status-avoid { color: #fca5a5; background: rgba(239, 68, 68, 0.2); }
        
        .drivers-list { font-size: 13px; color: #cbd5e1; margin-top: 12px; line-height: 1.5; background: rgba(15, 23, 42, 0.4); padding: 10px; border-radius: 8px; }
        .impact-high { color: #fca5a5; font-weight: bold; }
        .impact-medium { color: #fde047; font-weight: bold; }
        
        /* POPUP SYSTEM */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.9); justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(8px); }
        .modal-content { background: #1e293b; border-radius: 20px; padding: 40px; max-width: 700px; width: 90%; border: 1px solid #334155; position: relative; }
        .close-btn { position: absolute; top: 20px; right: 25px; color: #94a3b8; font-size: 32px; cursor: pointer; }
        .modal-box { background: #0f172a; padding: 20px; border-radius: 10px; border-left: 6px solid #38bdf8; margin-top: 20px; color: #e2e8f0; line-height: 1.6; }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>Live Institutional Risk Engine</h1>
            <div style="color: #94a3b8; font-size: 16px; margin-top: 6px;">Scanned via Forex Factory Data Loop Feed</div>
        </div>
        <div class="live-badge">
            <div class="live-dot"></div> Live Forex Factory Sync Active
        </div>
    </header>

    <h2 id="current-week-title" style="color: #cbd5e1; margin-bottom: 25px; font-size: 26px;">Current Operational Week</h2>

    <div class="grid">
        <div class="weekday">Sun</div><div class="weekday">Mon</div><div class="weekday">Tue</div>
        <div class="weekday">Wed</div><div class="weekday">Thu</div><div class="weekday">Fri</div>
        <div class="weekday">Sat</div>
    </div>

    <div class="grid" id="live-calendar-grid"></div>

    <div class="modal" id="rule-modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modal-title" style="font-size: 28px; margin-bottom: 5px;">Protocol Parameters</h2>
            <p id="modal-date" style="color: #94a3b8; font-weight: bold; margin-bottom: 20px;"></p>
            
            <p><strong>Parsed Active News Items:</strong></p>
            <div id="modal-drivers" style="margin-bottom: 20px; font-size: 15px;"></div>
            
            <div class="modal-box">
                <div style="font-weight:bold; color:#38bdf8; text-transform:uppercase; font-size:13px; margin-bottom:5px;">🎯 Execution Setup & Sizing</div>
                <p id="modal-strategy" style="margin:0; font-size:15px;"></p>
            </div>

            <div class="modal-box" style="border-left-color: #ef4444; background: #1b1c26;">
                <div style="font-weight:bold; color:#fca5a5; text-transform:uppercase; font-size:13px; margin-bottom:5px;">⚠️ Salman's Rule Checklist</div>
                <p id="modal-checklist" style="margin:0; font-size:14px; white-space:pre-line;"></p>
            </div>
        </div>
    </div>

    <script>
        // Bypasses local firewall limits directly through a clean JSON wrapper endpoint
        const PROXY_FEED = "https://api.allorigins.win/get?url=" + encodeURIComponent("https://www.forexfactory.com/ff_calendar_thisweek.xml");

        async function fetchLiveMarketData() {
            try {
                const response = await fetch(PROXY_FEED);
                const data = await response.json();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(data.contents, "text/xml");
                const events = xmlDoc.getElementsByTagName("event");
                
                let parsedEvents = {};
                
                for (let i = 0; i < events.length; i++) {
                    let country = events[i].getElementsByTagName("country")[0]?.textContent;
                    if (country === "USD") {
                        let title = events[i].getElementsByTagName("title")[0]?.textContent;
                        let dateStr = events[i].getElementsByTagName("date")[0]?.textContent; // MM-DD-YYYY
                        let time = events[i].getElementsByTagName("time")[0]?.textContent;
                        let impact = events[i].getElementsByTagName("impact")[0]?.textContent;
                        
                        if (!parsedEvents[dateStr]) parsedEvents[dateStr] = [];
                        parsedEvents[dateStr].push({ title, time, impact });
                    }
                }
                buildDynamicCalendar(parsedEvents);
            } catch (error) {
                console.error("Data fallback initiated:", error);
                buildDynamicCalendar({}); // Safe backup engine fallback
            }
        }

        function evaluateDayLogic(dayNum, dayEvents) {
            const hasHighImpact = dayEvents.some(e => e.impact === "High");
            const hasMedImpact = dayEvents.some(e => e.impact === "Medium");
            const hasCPI = dayEvents.some(e => e.title.toLowerCase().includes("cpi"));
            const hasPPI = dayEvents.some(e => e.title.toLowerCase().includes("ppi"));
            const hasClaims = dayEvents.some(e => e.title.toLowerCase().includes("claims"));
            const hasRetail = dayEvents.some(e => e.title.toLowerCase().includes("retail"));
            const hasFOMC = dayEvents.some(e => e.title.toLowerCase().includes("fomc") || e.title.toLowerCase().includes("powell"));
            const hasPMI = dayEvents.some(e => e.title.toLowerCase().includes("pmi") || e.title.toLowerCase().includes("ism"));

            // WEEKENDS
            if (dayNum === 0 || dayNum === 6) {
                return { status: 'empty', label: 'Weekend', strategy: 'Market closed.', checklist: 'No execution footprint.' };
            }

            // MONDAYS
            if (dayNum === 1) {
                if (hasPMI || hasHighImpact || hasMedImpact) {
                    return {
                        status: 'trade', label: 'Trade - 10AM Protocol',
                        strategy: 'Look for clean algorithmic layouts strictly between 9:35 AM and 9:45 AM. If nothing sets up, stay out until the 10:40 AM macro sequence forms when news settles.',
                        checklist: '• Scan for entries specifically at 9:35 AM - 9:45 AM\n• If market holds flat at 9:50 AM, step aside until 10:00 AM drops\n• Volatility dies out completely by 10:45 AM.'
                    };
                }
                return {
                    status: 'avoid', label: 'Avoid - Worst Day 🗑️',
                    strategy: 'Monday No-News trap. Low probability structural loops. Lacks injected volatility, causing sluggish accumulation brackets. Sit on your hands.',
                    checklist: '• Do not force entries into slow barcode ranges\n• Switch directly to Tape Reading / Forward Testing\n• Protect margin thresholds from choppy accumulation profiles.'
                };
            }

            // TUESDAYS
            if (dayNum === 2) {
                if (hasCPI) {
                    return {
                        status: 'avoid', label: 'Avoid - CPI Exhaustion 🛑',
                        strategy: 'CPI prints bring massive pre-market expansions (200-400 points), completely draining the day session parameters. If taking trades, expect extreme manipulation at the bell.',
                        checklist: '• Critical Context: If overnight extension exceeds 250 points, STEP AWAY!\n• Verification Signature: Look for distinct 9:30 AM SMT or Turtle Soups\n• Risk Profile is inherently low-probability due to massive early displacement.'
                    };
                }
                return {
                    status: 'trade', label: 'Trade - Favorite Day 👑',
                    strategy: 'Statistically Salman\'s highest probability win-rate setting. Fluid algorithmic price delivery dominates. Standard contract scaling is greenlit.',
                    checklist: '• Standard risk configurations are completely active\n• Target crisp 9:30 AM opening setups\n• For 10:00 AM news: Wait 30 seconds to 2 minutes post-release to execute.'
                };
            }

            // WEDNESDAYS
            if (dayNum === 3) {
                if (hasPPI) {
                    return {
                        status: 'trade', label: 'Trade - PPI Seek & Destroy 🔥',
                        strategy: 'PPI sets high probability parameters. Expect a classic Seek & Destroy layout. Look for a sweep of external highs/lows at the open with SMT, then track the swift reversal leg.',
                        checklist: '• Anticipate premium displacement expansion tracks\n• Map your external draws on liquidity clearly at 9:30 AM\n• Trade the expansion leg with complete conviction once SMT confirms.'
                    };
                }
                if (hasFOMC) {
                    return {
                        status: 'caution', label: 'Caution - AM Session Only ⚠️',
                        strategy: 'Trade the morning AM session normally if layouts surface. Do NOT touch the PM afternoon session. 2:00 PM FOMC updates are highly manipulated traps.',
                        checklist: '• AM Macro: Normal operational focus allowed\n• PM Session: Strictly prohibited after 12:00 PM\n• Never expose funded accounts to unexpected 2:00 PM speaker spikes.'
                    };
                }
                return { status: 'trade', label: 'Trade - Full Size', strategy: 'Fluid midweek volume parameters. Track standard delivery parameters.', checklist: '• Execute normal sizing if liquidity pools sweep cleanly.' };
            }

            // THURSDAYS
            if (dayNum === 4) {
                return {
                    status: 'trade', label: 'Trade - 2nd Favorite Day ✅',
                    strategy: 'Unemployment Claims / Retail Sales supply clean systemic volume into the open without running toxic pre-market overnight expansion levels. Highly efficient parameters.',
                    checklist: '• Premium trading environment\n• Full standard contract size allocations permitted\n• Fast, clean execution runs across standard macro frames.'
                };
            }

            // FRIDAYS
            if (dayNum === 5) {
                if (dayEvents.some(e => e.title.includes("Payroll"))) {
                    return {
                        status: 'caution', label: 'Caution - Cut Size 50% 🎰',
                        strategy: 'NFP Friday brings severe pre-market manipulation. You must wait for the 9:30 AM opening bell manipulation to print the day\'s high/low before scanning the macro for entry confirmation.',
                        checklist: '• Slice risk models in half to protect margins\n• Low/High of the day forms between 9:30 AM - 9:35 AM\n• Wait 5-10 minutes for distinct displacement steps before entering.'
                    };
                }
                return {
                    status: 'avoid', label: 'Avoid - Casino Rule ❌',
                    strategy: 'Second worst trading day. Weekly funding milestones should already be reached. Do not gamble hard-earned profit allocations back into low-volume closing ranges.',
                    checklist: '• Blackjack Sizing Analog: Lower win percentages require lower exposure!\n• Cut contract sizes by 50% minimum if trading, or shut down entirely\n• Focus strictly on journaling and tape reading.'
                };
            }

            return { status: 'trade', label: 'Standard Trade Day', strategy: 'Standard protocols.', checklist: 'Execute normal model parameters.' };
        }

        function buildDynamicCalendar(liveData) {
            const grid = document.getElementById("live-calendar-grid");
            grid.innerHTML = "";
            
            let targetDate = new Date(); // Automatically maps to the active current week frame
            let currentDayIdx = targetDate.getDay();
            
            // Re-align date pointer to the current week's Sunday boundary
            let startOfWeek = new Date(targetDate);
            startOfWeek.setDate(targetDate.getDate() - currentDayIdx);

            document.getElementById("current-week-title").innerText = "Operational Week: Syncing Data Tracks";

            for (let i = 0; i < 7; i++) {
                let cardDate = new Date(startOfWeek);
                cardDate.setDate(startOfWeek.getDate() + i);
                
                // Formats target key matching the Forex Factory XML date schema: MM-DD-YYYY
                let keyMonth = String(cardDate.getMonth() + 1).padStart(2, '0');
                let keyDay = String(cardDate.getDate()).padStart(2, '0');
                let keyYear = cardDate.getFullYear();
                let dataKey = `${keyMonth}-${keyDay}-${keyYear}`;
                
                let dayEvents = liveData[dataKey] || [];
                let protocol = evaluateDayLogic(i, dayEvents);
                
                let card = document.createElement("div");
                if (protocol.status === 'empty') {
                    card.className = "day-card empty";
                    card.innerHTML = `<div class="date-num" style="color:#475569;">${cardDate.getDate()}</div>`;
                } else {
                    card.className = `day-card ${protocol.status}`;
                    
                    let driversHTML = dayEvents.map(e => {
                        let impactClass = e.impact === "High" ? "impact-high" : (e.impact === "Medium" ? "impact-medium" : "");
                        return `<div class="${impactClass}">• [${e.time}] ${e.title}</div>`;
                    }).join("") || "<div>• No Key USD News Scheduled</div>";

                    card.onclick = () => showModal(cardDate, protocol, dayEvents);
                    card.innerHTML = `
                        <div class="date-num">${cardDate.getDate()} <span style="font-size:14px; color:#64748b; font-weight:normal;">${cardDate.toLocaleDateString('en-US', {month:'short'})}</span></div>
                        <div class="drivers-list">${driversHTML}</div>
                        <span class="status-txt status-${protocol.status}">${protocol.label}</span>
                    `;
                }
                grid.appendChild(card);
            }
        }

        function showModal(date, protocol, events) {
            document.getElementById('modal-title').innerText = protocol.label;
            document.getElementById('modal-date').innerText = date.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
            
            let driversHTML = events.map(e => `• <strong>[${e.time}]</strong> ${e.title} (Impact: ${e.impact})`).join("<br>") || "No Active News Drivers Found.";
            document.getElementById('modal-drivers').innerHTML = driversHTML;
            document.getElementById('modal-strategy').innerText = protocol.strategy;
            document.getElementById('modal-checklist').innerText = protocol.checklist;
            document.getElementById('rule-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('rule-modal').style.display = 'none'; }
        
        window.onload = fetchLiveMarketData;
    </script>
</body>
</html>
