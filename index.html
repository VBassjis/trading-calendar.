<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institutional Trading Calendar</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 800px; margin: 0 auto; }
        h1 { color: #38bdf8; border-bottom: 2px solid #334155; padding-bottom: 10px; }
        .day-card { background: #1e293b; border-radius: 8px; padding: 15px; margin-bottom: 15px; border-left: 6px solid #64748b; }
        .trade { border-left-color: #22c55e; }
        .caution { border-left-color: #eab308; }
        .avoid { border-left-color: #ef4444; }
        .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; margin-bottom: 10px; text-transform: uppercase; }
        .badge-trade { background: #166534; color: #4ade80; }
        .badge-caution { background: #713f12; color: #fde047; }
        .badge-avoid { background: #991b1b; color: #fca5a5; }
        .meta { color: #94a3b8; font-size: 14px; margin-top: 5px; }
        .rule { background: #0f172a; padding: 10px; border-radius: 4px; margin-top: 10px; font-style: italic; color: #cbd5e1; border-left: 3px solid #38bdf8; }
    </style>
</head>
<body>

    <h1>Institutional Trading Calendar Dashboard</h1>
    <div id="calendar-container">Loading current market protocols...</div>

    <script>
        const evaluateDay = (dayName, events) => {
            const hasCPI = events.some(e => e.title.includes('CPI'));
            const hasPPI = events.some(e => e.title.includes('PPI'));
            const hasRetail = events.some(e => e.title.includes('Retail Sales'));
            const hasClaims = events.some(e => e.title.includes('Unemployment Claims'));

            if (dayName === 'Monday') {
                return { status: 'avoid', label: 'Low Probable / Avoid', rule: 'Monday No-News Protocol: Low structural probability. Sit on your hands.' };
            }
            if (hasCPI) {
                return { status: 'trade', label: 'Regular AM Session Protocol', rule: 'Tuesday CPI Drop: Watch the 6:30 AM displacement. Trade regular AM session with strict size control.' };
            }
            if (hasPPI) {
                return { status: 'trade', label: 'High Probable Setup', rule: 'Wednesday PPI Premarket: Classic Seek & Destroy configuration. Premium environment.' };
            }
            if (hasRetail || hasClaims) {
                return { status: 'trade', label: 'High Probable Setup', rule: 'Thursday Driving Pack: Retail Sales & Unemployment Claims present high liquidity delivery.' };
            }
            if (dayName === 'Friday') {
                return { status: 'avoid', label: 'Non-Tradeable / Avoid', rule: 'Friday Protocol: Weekly targets hit. Do not give gains back to the casino.' };
            }
            
            return { status: 'trade', label: 'Standard Trade Conditions', rule: 'Normal session parameters apply. Follow standard AM setups.' };
        };

        async function initCalendar() {
            const container = document.getElementById('calendar-container');
            
            const weekDays = [
                { name: 'Monday', date: 'May 11, 2026', events: [{ title: 'Existing Home Sales' }] },
                { name: 'Tuesday', date: 'May 12, 2026', events: [{ title: 'Core CPI m/m' }, { title: 'CPI y/y' }] },
                { name: 'Wednesday', date: 'May 13, 2026', events: [{ title: 'Core PPI m/m' }, { title: 'Crude Oil Inventories' }] },
                { name: 'Thursday', date: 'May 14, 2026', events: [{ title: 'Unemployment Claims' }, { title: 'Core Retail Sales m/m' }] },
                { name: 'Friday', date: 'May 15, 2026', events: [{ title: 'Industrial Production m/m' }] }
            ];

            container.innerHTML = '';

            weekDays.forEach(day => {
                const evaluation = evaluateDay(day.name, day.events);
                const card = document.createElement('div');
                card.className = `day-card ${evaluation.status}`;
                
                const eventsList = day.events.map(e => `• ${e.title}`).join('<br>');

                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h3 style="margin:0;">${day.name} (${day.date})</h3>
                        <span class="status-badge badge-${evaluation.status}">${evaluation.label}</span>
                    </div>
                    <div class="meta"><strong>Key Drivers:</strong><br>${eventsList}</div>
                    <div class="rule"><strong>Mentor Protocol:</strong> ${evaluation.rule}</div>
                `;
                container.appendChild(card);
            });
        }

        window.onload = initCalendar;
    </script>
</body>
</html>
