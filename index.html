<!DOCTYPE html>
<html lang="en">
<head>
    <title>Institutional Trading Calendar</title>
    <script>
        // This function fetches the live news data
        async function fetchForexNews() {
            try {
                // We use a proxy because Forex Factory blocks direct browser requests
                const response = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent('https://www.forexfactory.com/calendar?type=json'));
                const data = await response.json();
                const newsEvents = JSON.parse(data.contents);
                
                displayNews(newsEvents);
            } catch (error) {
                console.error("News fetch failed:", error);
            }
        }

        function displayNews(events) {
            const container = document.getElementById('news-list');
            // Filter for High Impact (Red Folder) USD News
            const usdNews = events.filter(e => e.currency === 'USD' && e.impact === 'High');
            
            usdNews.forEach(event => {
                const item = document.createElement('div');
                item.innerHTML = `<b>${event.title}</b> - ${event.date} at ${event.time}`;
                container.appendChild(item);
            });
        }

        window.onload = fetchForexNews;
    </script>
</head>
<body>
    <h1>My Trading Calendar</h1>
    <div id="news-list">Loading live news...</div>
</body>
</html>
