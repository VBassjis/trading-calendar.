<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institutional Trading Calendar (2026-2029)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 900px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; padding-bottom: 15px; margin-bottom: 20px; }
        h1 { color: #38bdf8; margin: 0; font-size: 24px; }
        .nav-btn { background: #38bdf8; color: #0f172a; border: none; padding: 8px 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-left: 5px; }
        .nav-btn:hover { background: #0ea5e9; }
        .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
        .weekday { text-align: center; font-weight: bold; color: #94a3b8; padding: 5px; text-transform: uppercase; font-size: 12px; }
        .day-card { background: #1e293b; border-radius: 6px; padding: 10px; min-height: 100px; display: flex; flex-direction: column; justify-content: space-between; border-left: 5px solid #64748b; cursor: pointer; transition: transform 0.1s; }
        .day-card:hover { transform: scale(1.02); background: #24344d; }
        .empty { background: transparent; pointer-events: none; border: none; }
        .trade { border-left-color: #22c55e; }
        .caution { border-left-color: #eab308; }
        .avoid { border-left-color: #ef4444; }
        .date-num { font-weight: bold; font-size: 16px; }
        .status-txt { font-size: 11px; font-weight: bold; text-transform: uppercase; margin-top: 4px; padding: 2px 4px; border-radius: 3px; display: inline-block; }
        .status-trade { color: #4ade80; background: rgba(34, 197, 94, 0.1); }
        .status-caution { color: #fde047; background: rgba(234, 179, 8, 0.1); }
        .status-avoid { color: #fca5a5; background: rgba(239, 68, 68, 0.1); }
        .drivers { font-size: 11px; color: #94a3b8; margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        /* Modal Popup styles */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.8); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #1e293b; border-radius: 8px; padding: 25px; max-width: 500px; width: 90%; border: 1px solid #334155; position: relative; }
        .close-btn { position: absolute; top: 10px; right: 15px; color: #94a3b8; font-size: 24px; cursor: pointer; }
        .modal h2 { color: #38bdf8; margin-top: 0; }
        .modal-rule { background: #0f172a; padding: 12px; border-radius: 4px; border-left: 4px solid #38bdf8; font-style: italic; margin-top: 15px; color: #cbd5e1; }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>Institutional Trading Protocol Dashboard</h1>
            <div style="color: #94a3b8; font-size: 14px; margin-top: 4px;">Automated Risk Matrix (2026 - 2029)</div>
        </div>
        <div>
            <button class="nav-btn" onclick="changeMonth(-1)">« Prev</button>
            <button class="nav-btn" onclick="goToToday()">Today</button>
            <button class="nav-btn" onclick="changeMonth(1)">Next »</button>
        </div>
    </header>

    <h2 id="month-year-title" style="color: #cbd5e1; margin-bottom: 15px;"></h2>

    <div class="grid" id="weekday-header">
        <div class="weekday">Sun</div><div class="weekday">Mon</div><div class="weekday">Tue</div>
        <div class="weekday">Wed</div><div class="weekday">Thu</div><div class="weekday">Fri</div>
        <div class="weekday">Sat</div>
    </div>

    <div class="grid" id="calendar-grid"></div>

    <div class="modal" id="rule-modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modal-title">Day Overview</h2>
            <p id="modal-date" style="color: #94a3b8; font-weight: bold;"></p>
            <p><strong>Anticipated High-Impact Drivers:</strong></p>
            <p id="modal-drivers" style="color: #e2e8f0;"></p>
            <div class="modal-rule">
                <strong>Mentor Execution Protocol:</strong>
                <p id="modal-protocol-text" style="margin: 5px 0 0 0;"></p>
            </div>
        </div>
    </div>

    <script>
        let currentCalendarDate = new Date(); // Tracks the currently viewed month

        // Rule Engine Logic maps recurring structural schedules perfectly
        function getDayProtocol(date) {
            const dayNum = date.getDay();
            const dayOfMonth = date.getDate();
            const dayName = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][dayNum];
            
            // Calculate week position (e.g., 1st Friday, 2nd Tuesday)
            const weekIndex = Math.ceil(dayOfMonth / 7);

            if (dayNum === 0 || dayNum === 6) {
                return { status: 'empty', label: 'Weekend', drivers: 'Market Closed', rule: 'Weekend gap tracking. Do not hold positions over the weekly boundary.' };
            }

            // 1. Monday No News Rule
            if (dayNum === 1) {
                return { status: 'avoid', label: 'Avoid / Low Probable', drivers: 'No High-Impact USD News', rule: 'Monday No-News Protocol: Low structural order flow probability. Rest your eyes and sit on your hands.' };
            }

            // 2. CPI Schedule Estimation (Typically 2nd Tuesday/Wednesday of the month)
            if (dayNum === 2 && weekIndex === 2) {
                return { status: 'trade', label: 'Regular AM Session', drivers: 'Core CPI m/m / CPI y/y', rule: 'Tuesday CPI Drop: High volatility expected at 6:30 AM. Allow news to settle. Trade the regular AM session expansion under normal size parameters.' };
            }

            // 3. PPI Sequence Protocol (The Wednesday right after CPI week parameters)
            if (dayNum === 3 && weekIndex === 2) {
                return { status: 'trade', label: 'High Probable Setup', drivers: 'Core PPI m/m / Crude Oil', rule: 'Wednesday PPI Premarket Sequence: Classic institutional Seek & Destroy setup. Premium market delivery environment. Hunt clean execution targets.' };
            }

            // 4. Heavy Driving Pack Thursday
            if (dayNum === 4) {
                let drivers = 'Unemployment Claims';
                if (weekIndex === 2) drivers += ' / Core Retail Sales m/m';
                else if (weekIndex === 4) drivers += ' / Core PCE Price Index';
                return { status: 'trade', label: 'High Probable Setup', drivers: drivers, rule: 'Thursday Driving Pack: High volume and premium liquidity distributions are regular here. Standard setups run at full risk allocation.' };
            }

            // 5. NFP Schedule (First Friday of the Month)
            if (dayNum === 5 && weekIndex === 1) {
                return { status: 'caution', label: 'Caution / NFP Protocol', drivers: 'Non-Farm Payrolls / Unemployment Rate', rule: 'NFP Friday Protocol: Significant pre-market manipulation. Stand aside until the 9:30 AM manipulation window clears completely before searching for institutional footprints.' };
            }

            // 6. Standard Friday Rule
            if (dayNum === 5) {
                return { status: 'avoid', label: 'Avoid / Non-Tradeable', drivers: 'Standard Friday Close out', rule: 'Friday Casino Rule: Weekly targets should already be fulfilled. Do not give earned gains back to the market during lower volume session endings.' };
            }

            // Standard fallback weekday
            return { status: 'trade', label: 'Standard Trade Day', drivers: 'Medium Impact Schedules', rule: 'Normal market execution parameters apply. Follow standard morning session protocols.' };
        }

        function renderCalendar() {
            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();
            
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById('month-year-title').innerText = `${monthNames[month]} ${year}`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            const gridContainer = document.getElementById('calendar-grid');
            gridContainer.innerHTML = '';

            // Render empty spacer cards for calendar alignment
            for (let i = 0; i < firstDayIndex; i++) {
                const spacer = document.createElement('div');
                spacer.className = 'day-card empty';
                gridContainer.appendChild(spacer);
            }

            // Render live daily operational cards
            for (let day = 1; day <= totalDays; day++) {
                const checkDate = new Date(year, month, day);
                const protocol = getDayProtocol(checkDate);
                
                const card = document.createElement('div');
                if (protocol.status === 'empty') {
                    card.className = 'day-card empty';
                    card.innerHTML = `<div class="date-num" style="color:#475569;">${day}</div>`;
                } else {
                    card.className = `day-card ${protocol.status}`;
                    card.onclick = () => showModal(checkDate, protocol);
                    card.innerHTML = `
                        <div class="date-num">${day}</div>
                        <div class="drivers">${protocol.drivers}</div>
                        <span class="status-txt status-${protocol.status}">${protocol.label}</span>
                    `;
                }
                gridContainer.appendChild(card);
            }
        }

        function changeMonth(direction) {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() + direction);
            renderCalendar();
        }

        function goToToday() {
            currentCalendarDate = new Date();
            renderCalendar();
        }

        function showModal(date, protocol) {
            document.getElementById('modal-title').innerText = protocol.label;
            document.getElementById('modal-date').innerText = date.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            document.getElementById('modal-drivers').innerText = protocol.drivers;
            document.getElementById('modal-protocol-text').innerText = protocol.rule;
            document.getElementById('rule-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('rule-modal').style.display = 'none';
        }

        // Initialize calendar dashboard display on window load
        window.onload = renderCalendar;
    </script>
</body>
</html>
